name: Build OTP Forwarder APK

on:
  push:
    paths:
      - 'otpAutofillSystem/app/**'
      - '.github/workflows/build-otp-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: otpAutofillSystem/app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp otpAutofillSystem/app/app/build/outputs/apk/debug/app-debug.apk OtpForwarder.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OtpForwarder-apk
          path: OtpForwarder.apk
          if-no-files-found: error

      - name: Publish APK to Release (public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: otp-app
          name: OTP Forwarder app (latest)
          body: Latest OTP Forwarder APK. Install on Android, enter your number, allow SMS.
          files: OtpForwarder.apk
